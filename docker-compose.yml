# Default runtime stack (5 services, 11.0 GB RAM limit = 1536M kafka + 2048M mongo + 6144M spark + 1024M toc-web + 512M live-consumer)
services:
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - bda501-net

  mongo:
    image: mongo:8.0
    command: ["mongod", "--wiredTigerCacheSizeGB", "1.0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bda501-net

  spark:
    image: hcmc-traffic-spark:3.5.7
    build:
      context: .
      dockerfile: Dockerfile.spark35
    working_dir: /workspace
    command: ["python3", "-c", "import time; time.sleep(10**8)"]
    environment:
      SPARK_DRIVER_MEMORY: 4g
      MONGO_URI: mongodb://mongo:27017
    volumes:
      - ./:/workspace
    deploy:
      resources:
        limits:
          memory: 6144M
          cpus: "4.0"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bda501-net

  toc-web:
    image: groupexe-knowledgetest-app
    build: .
    environment:
      MONGO_URI: mongodb://mongo:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["uvicorn", "toc_backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./toc_backend:/app/toc_backend
      - ./toc_frontend/dist:/app/toc_frontend/dist
      - ./baseline.py:/app/baseline.py
      - ./producer.py:/app/producer.py
      - ./starter_stream.py:/app/starter_stream.py
      - ./live_kafka_stream.py:/app/live_kafka_stream.py
      - ./pipeline.py:/app/pipeline.py
      - ./raw_data:/app/raw_data:ro
      - ./evidence:/app/evidence
      - ./data:/app/data
      - ./outputs:/app/outputs
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - bda501-net

  live-consumer:
    image: groupexe-knowledgetest-app
    build: .
    environment:
      MONGO_URI: mongodb://mongo:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command:
      [
        "python",
        "starter_stream.py",
        "--from-kafka",
        "--bootstrap-servers",
        "kafka:29092",
        "--mongo-uri",
        "mongodb://mongo:27017",
        "--continuous",
      ]
    volumes:
      - ./starter_stream.py:/app/starter_stream.py
      - ./live_kafka_stream.py:/app/live_kafka_stream.py
      - ./producer.py:/app/producer.py
      - ./pipeline.py:/app/pipeline.py
      - ./baseline.py:/app/baseline.py
      - ./raw_data:/app/raw_data:ro
      - ./data:/app/data
      - ./outputs:/app/outputs
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      disable: true
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - bda501-net

  pipeline:
    image: groupexe-knowledgetest-app
    build: .
    profiles: ["batch"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "pipeline.py"]
    volumes:
      - ./pipeline.py:/app/pipeline.py
      - ./baseline.py:/app/baseline.py
      - ./producer.py:/app/producer.py
      - ./starter_stream.py:/app/starter_stream.py
      - ./live_kafka_stream.py:/app/live_kafka_stream.py
      - ./spark_engine.py:/app/spark_engine.py
      - ./spark_batch.py:/app/spark_batch.py
      - ./scripts:/app/scripts
      - ./raw_data:/app/raw_data:ro
      - ./evidence:/app/evidence
      - ./product:/app/product
      - ./data:/app/data
      - ./outputs:/app/outputs
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - bda501-net

  stream:
    image: groupexe-knowledgetest-app
    build: .
    profiles: ["stream"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "starter_stream.py", "--kill-after-batch", "1"]
    volumes:
      - ./starter_stream.py:/app/starter_stream.py
      - ./live_kafka_stream.py:/app/live_kafka_stream.py
      - ./producer.py:/app/producer.py
      - ./pipeline.py:/app/pipeline.py
      - ./baseline.py:/app/baseline.py
      - ./raw_data:/app/raw_data:ro
      - ./data:/app/data
      - ./outputs:/app/outputs
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - bda501-net

networks:
  bda501-net:
    name: bda501-net
    driver: bridge

volumes:
  mongo_data:
  kafka_data:
